<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>অ্যাডমিন প্যানেল | খামারি বাজার</title>
<meta name="theme-color" content="#12291e">
<meta name="robots" content="noindex">
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&text=0123456789.,%25%2B:&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=202610040451">
<link rel="stylesheet" href="css/admin.css?v=202610040451">
</head>
<body class="adm">
<div id="app"></div>
<div class="modal" id="modal"><div class="box wide" id="mbox"></div></div>
<script src="js/icons.js?v=202610040451"></script>
<script src="js/app.js?v=202610040451"></script>
<script>
(() => {
  const { CATS, catOf, ic, esc, bn, money, ago, ph, posts, savePosts, users, me, toast, avatar, catPic } = KB;
  const $ = id => document.getElementById(id);
  const app = $('app'), u = me();

  // ---------- access gate ----------
  if (!u) { KB.requireLogin(); return; }
  if (u.role !== 'admin') {
    app.innerHTML = `<div class="wrap" style="padding-top:60px"><div class="empty-a"><i>${ic('lucide:ban')}</i><h3>শুধু অ্যাডমিনের জন্য</h3><p>এই পেজ দেখার অনুমতি আপনার নেই।</p><a class="btn btn-green" href="/" style="margin-top:14px">হোমে ফিরুন</a></div></div>`;
    return;
  }

  const saveUsers = l => KB.set('users', l);
  const TITLES = { dash: 'ড্যাশবোর্ড', posts: 'পোস্ট রিভিউ', users: 'ইউজার ম্যানেজমেন্ট', cats: 'ক্যাটাগরি', blogs: 'ব্লগ' };
  let view = TITLES[location.hash.slice(1)] ? location.hash.slice(1) : 'dash';
  const ps = { tab: 'pending', q: '', cat: '' };
  const us = { q: '' };

  // ---------- shell ----------
  app.innerHTML = `
  <div class="adm-shell">
    <aside class="adm-side" id="aside">
      <div class="adm-brand"><img src="logo.png" alt="খামারি বাজার"><small>অ্যাডমিন প্যানেল</small></div>
      <nav class="adm-nav" id="anav"></nav>
      <div class="adm-foot">
        <div class="adm-me">${avatar(u)}<div><b>${esc(u.name)}</b><small>অ্যাডমিন</small></div></div>
        <a href="/">${ic('lucide:external-link')} সাইট দেখুন</a>
        <button id="alo">${ic('lucide:log-out')} লগআউট</button>
      </div>
    </aside>
    <div class="adm-bg" id="abg"></div>
    <div class="adm-main">
      <header class="adm-top"><button class="adm-menu" id="amenu" aria-label="মেনু">${ic('lucide:menu')}</button><h1 id="atitle"></h1></header>
      <div class="adm-body" id="view"></div>
    </div>
  </div>`;
  const side = on => { $('aside').classList.toggle('open', on); $('abg').classList.toggle('open', on); };
  $('amenu').onclick = () => side(true); $('abg').onclick = () => side(false);
  $('alo').onclick = KB.logout;

  function renderNav() {
    const pend = posts().filter(p => p.status === 'pending').length;
    const items = [['dash', 'lucide:layout-dashboard'], ['posts', 'lucide:newspaper'], ['users', 'lucide:users'], ['cats', 'lucide:tags'], ['blogs', 'lucide:book-open']];
    $('anav').innerHTML = '<h6>মেনু</h6>' + items.map(([k, i]) =>
      `<button data-v="${k}" class="${k === view ? 'on' : ''}">${ic(i)} ${TITLES[k]}${k === 'posts' && pend ? `<span class="cnt">${bn(pend)}</span>` : ''}</button>`).join('');
  }
  $('anav').onclick = e => { const b = e.target.closest('[data-v]'); if (b) go(b.dataset.v); };
  function go(v) { view = v; location.hash = v; side(false); scrollTo(0, 0); render(); }

  function render() {
    renderNav(); $('atitle').textContent = TITLES[view];
    ({ dash: renderDash, posts: renderPosts, users: renderUsers, cats: renderCats, blogs: renderBlogs })[view]();
    KB.enhanceSelects($('view'));
  }

  // ---------- shared ----------
  const seller = p => users().find(x => x.id === p.sellerId);
  const stBadge = s => s === 'approved' ? `<span class="badge ok">${ic('lucide:circle-check')} প্রকাশিত</span>` : s === 'pending' ? `<span class="badge wait">${ic('lucide:hourglass')} পেন্ডিং</span>` : `<span class="badge no">${ic('lucide:circle-x')} বাতিল</span>`;
  const setStatus = (id, status, reason = '') => savePosts(posts().map(p => p.id === id ? { ...p, status, reason } : p));

  // ---------- modal ----------
  const mbox = $('mbox');
  const openModal = html => { mbox.innerHTML = html; $('modal').classList.add('open'); KB.enhanceSelects(mbox); };
  const closeModal = () => $('modal').classList.remove('open');
  $('modal').onclick = e => { if (e.target === $('modal') || e.target.closest('[data-close]')) closeModal(); };
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

  // ---------- জেনেরিক ডেটা টেবিল (সর্ট, পেজ, সিলেক্ট) ----------
  const T = { posts: { page: 1, key: 'date', dir: -1, sel: new Set() }, users: { page: 1, key: 'name', dir: 1 }, blogs: { page: 1, key: 'date', dir: -1 }, cats: { page: 1 } };
  const SIZE = 8;
  const cmp = (a, b) => typeof a === 'number' && typeof b === 'number' ? a - b : String(a).localeCompare(String(b), 'bn');
  // cols: [{ key, label, html(row), val(row)?, cls? }]  opt: { id(row), selectable, all, minw, empty }
  function table(name, cols, rows, opt = {}) {
    const st = T[name] || (T[name] = { page: 1 });
    const size = opt.size || SIZE;
    const sc = cols.find(c => c.key === st.key && c.val);
    if (sc && !opt.all) rows = [...rows].sort((a, b) => cmp(sc.val(a), sc.val(b)) * st.dir);
    const pages = Math.max(1, Math.ceil(rows.length / size)); st.page = Math.min(Math.max(1, st.page), pages);
    const from = (st.page - 1) * size, slice = opt.all ? rows : rows.slice(from, from + size);
    const sel = st.sel, allOn = opt.selectable && slice.length && slice.every(r => sel.has(opt.id(r)));
    const th = (opt.selectable ? `<th class="c-chk"><input type="checkbox" data-selall="${name}" ${allOn ? 'checked' : ''} aria-label="সব বাছাই"></th>` : '') +
      cols.map(c => c.val && !opt.all
        ? `<th class="${c.cls || ''} sortable ${st.key === c.key ? 'on' : ''}" data-th="${name}:${c.key}" role="button" tabindex="0">${c.label}<i>${st.key === c.key ? ic(st.dir > 0 ? 'lucide:arrow-up' : 'lucide:arrow-down') : ''}</i></th>`
        : `<th class="${c.cls || ''}">${c.label}</th>`).join('');
    const body = slice.map(r => {
      const on = opt.selectable && sel.has(opt.id(r));
      return `<tr class="${on ? 'on' : ''}">${opt.selectable ? `<td class="c-chk"><input type="checkbox" data-sel="${name}" data-id="${opt.id(r)}" ${on ? 'checked' : ''} aria-label="বাছাই"></td>` : ''}${cols.map(c => `<td class="${c.cls || ''}">${c.html(r)}</td>`).join('')}</tr>`;
    }).join('');
    const nums = []; for (let i = Math.max(1, st.page - 2); i <= Math.min(pages, Math.max(5, st.page + 2)); i++) nums.push(i);
    const foot = opt.all || rows.length <= size && pages === 1 ? (opt.all ? '' : `<div class="dt-foot"><span>মোট <b>${bn(rows.length)}</b>টি</span></div>`) :
      `<div class="dt-foot"><span><b>${bn(from + 1)}-${bn(from + slice.length)}</b> / ${bn(rows.length)}টি</span>
        <div class="dt-pg"><button data-pg="${name}:${st.page - 1}" ${st.page === 1 ? 'disabled' : ''} aria-label="আগের">${ic('lucide:chevron-left')}</button>
          ${nums.map(i => `<button data-pg="${name}:${i}" class="${i === st.page ? 'on' : ''}">${bn(i)}</button>`).join('')}
          <button data-pg="${name}:${st.page + 1}" ${st.page === pages ? 'disabled' : ''} aria-label="পরের">${ic('lucide:chevron-right')}</button></div></div>`;
    if (!rows.length) return `<div class="dt-wrap"><div class="empty-a" style="box-shadow:none"><i>${ic(opt.emptyIcon || 'lucide:inbox')}</i>${opt.empty || 'কিছু পাওয়া যায়নি'}</div></div>`;
    return `<div class="dt-wrap"><table class="dt" style="min-width:${opt.minw || 860}px"><thead><tr>${th}</tr></thead><tbody>${body}</tbody></table></div>${foot}`;
  }
  const draw = n => ({ posts: drawPosts, users: drawUsers, blogs: drawBlogs, cats: drawCats })[n] ? ({ posts: drawPosts, users: drawUsers, blogs: drawBlogs, cats: drawCats })[n]() : render();
  document.addEventListener('click', e => {
    const th = e.target.closest('[data-th]');
    if (th) { const [n, k] = th.dataset.th.split(':'), st = T[n]; if (st.key === k) st.dir *= -1; else { st.key = k; st.dir = 1; } st.page = 1; return draw(n); }
    const pg = e.target.closest('[data-pg]');
    if (pg && !pg.disabled) { const [n, p] = pg.dataset.pg.split(':'); T[n].page = +p; draw(n); const w = document.querySelector('.dt-wrap'); if (w) w.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); }
  });
  document.addEventListener('change', e => {
    const one = e.target.closest('[data-sel]'), all = e.target.closest('[data-selall]');
    if (one) { const s = T[one.dataset.sel].sel; one.checked ? s.add(+one.dataset.id) : s.delete(+one.dataset.id); draw(one.dataset.sel); }
    else if (all) { const n = all.dataset.selall, s = T[n].sel; document.querySelectorAll(`[data-sel="${n}"]`).forEach(c => all.checked ? s.add(+c.dataset.id) : s.delete(+c.dataset.id)); draw(n); }
  });
  const thumb = (src, alt = '') => `<img class="dt-img" src="${esc(src)}" alt="${alt}" loading="lazy">`;

  // ---------- dashboard ----------
  function renderDash() {
    const all = posts(), us_ = users();
    const n = s => all.filter(p => p.status === s).length;
    const pend = all.filter(p => p.status === 'pending').sort((a, b) => b.createdAt - a.createdAt);
    const byCat = CATS.map(c => ({ c, n: all.filter(p => p.cat === c.id).length })).sort((a, b) => b.n - a.n).slice(0, 8);
    const mx = Math.max(1, ...byCat.map(x => x.n)), tot = Math.max(1, all.length);
    const kp = (i, v, l, hl = '') => `<div class="ak ${hl}"><i>${ic(i)}</i><div><b>${bn(v)}</b><span>${l}</span></div></div>`;
    $('view').innerHTML = `
      <div class="akpis">
        ${kp('lucide:hourglass', n('pending'), 'রিভিউর অপেক্ষায়', 'hl')}
        ${kp('lucide:circle-check', n('approved'), 'প্রকাশিত পোস্ট')}
        ${kp('lucide:newspaper', all.length, 'মোট পোস্ট')}
        ${kp('lucide:users', us_.length, 'মোট ইউজার')}
        ${kp('lucide:tags', CATS.length, 'ক্যাটাগরি')}
        ${kp('lucide:circle-x', n('rejected'), 'বাতিল পোস্ট')}
      </div>
      <div class="agrid">
        <div class="panel"><h3>${ic('lucide:trending-up')} ক্যাটাগরি অনুযায়ী পোস্ট</h3>
          ${byCat.map(x => `<div class="bar"><span>${ic(x.c.icon)} ${esc(x.c.name)}</span><div class="tr"><div class="fl" style="width:${x.n / mx * 100}%"></div></div><b>${bn(x.n)}</b></div>`).join('')}
        </div>
        <div class="panel"><h3>${ic('lucide:list-checks')} পোস্টের অবস্থা</h3>
          <div class="sbar"><i class="c-ok" style="width:${n('approved') / tot * 100}%"></i><i class="c-wait" style="width:${n('pending') / tot * 100}%"></i><i class="c-no" style="width:${n('rejected') / tot * 100}%"></i></div>
          <div class="leg"><div><i class="c-ok"></i>প্রকাশিত<b>${bn(n('approved'))}</b></div><div><i class="c-wait"></i>পেন্ডিং<b>${bn(n('pending'))}</b></div><div><i class="c-no"></i>বাতিল<b>${bn(n('rejected'))}</b></div></div>
        </div>
      </div>
      <div class="agrid">
        <div class="panel pt"><div class="panel-h"><h3>${ic('lucide:clock')} পেন্ডিং রিভিউ</h3><button class="btn btn-line btn-sm" data-v="posts">সব দেখুন</button></div>
          ${table('dpend', [
            { key: 'p', label: 'পোস্ট', html: p => `<div class="dt-cell">${thumb(p.images[0] || ph(catOf(p.cat).icon))}<div><b class="dt-t">${esc(p.title)}</b><small>${esc(p.breed)}</small></div></div>` },
            { key: 'd', label: 'এলাকা', html: p => esc(p.district) },
            { key: 't', label: 'সময়', html: p => ago(p.createdAt) },
            { key: 'a', label: 'অ্যাকশন', cls: 'c-act', html: p => `<div class="acts-row"><button class="ib ok" data-a="ok" data-id="${p.id}" aria-label="অনুমোদন">${ic('lucide:check')}</button><button class="ib" data-a="no" data-id="${p.id}" aria-label="বাতিল">${ic('lucide:x')}</button></div>` },
          ], pend.slice(0, 5), { all: true, minw: 520, empty: 'কোনো পেন্ডিং পোস্ট নেই', emptyIcon: 'lucide:circle-check' })}
        </div>
        <div class="panel pt"><div class="panel-h"><h3>${ic('lucide:user-plus')} সর্বশেষ ইউজার</h3><button class="btn btn-line btn-sm" data-v="users">সব দেখুন</button></div>
          ${table('dusers', [
            { key: 'u', label: 'ইউজার', html: x => `<div class="dt-cell">${avatar(x, 'sm')}<div><b class="dt-t">${esc(x.name)}</b></div></div>` },
            { key: 'p', label: 'মোবাইল', html: x => bn(esc(x.phone)) },
            { key: 'r', label: 'ভূমিকা', html: x => x.role === 'admin' ? '<span class="badge dark">অ্যাডমিন</span>' : '<span class="badge soft">ইউজার</span>' },
          ], us_.slice(-5).reverse(), { all: true, minw: 420 })}
        </div>
      </div>`;
  }

  // ---------- posts ----------
  function renderPosts() {
    const all = posts(), n = s => s === 'all' ? all.length : all.filter(p => p.status === s).length;
    const tabs = [['pending', 'পেন্ডিং'], ['approved', 'প্রকাশিত'], ['rejected', 'বাতিল'], ['all', 'সব']];
    $('view').innerHTML = `
      <div class="tbar"><div class="ptabs" id="ptabs">${tabs.map(([k, t]) => `<button data-t="${k}" class="${k === ps.tab ? 'on' : ''}">${t}<em>${bn(n(k))}</em></button>`).join('')}</div></div>
      <div class="tbar">
        <div class="sbox">${ic('lucide:search')}<input id="pq" type="search" placeholder="পোস্ট, জাত বা এলাকা খুঁজুন" value="${esc(ps.q)}"></div>
        <select id="pc" aria-label="ক্যাটাগরি"><option value="" data-img="img/category/web/all.webp">সব ক্যাটাগরি</option>${CATS.map(c => `<option value="${c.id}"${c.img ? ` data-img="${esc(c.img)}"` : ''}>${esc(c.name)}</option>`).join('')}</select>
      </div>
      <div id="bulk"></div>
      <div id="plist"></div>`;
    $('pc').value = ps.cat;
    const reset = () => { T.posts.page = 1; T.posts.sel.clear(); };
    $('ptabs').onclick = e => { const b = e.target.closest('[data-t]'); if (b) { ps.tab = b.dataset.t; reset(); render(); } };
    $('pq').oninput = e => { ps.q = e.target.value.trim(); reset(); drawPosts(); };
    $('pc').onchange = e => { ps.cat = e.target.value; reset(); drawPosts(); };
    drawPosts();
  }
  function drawPosts() {
    const list = posts().filter(p => (ps.tab === 'all' || p.status === ps.tab) && (!ps.cat || p.cat === ps.cat) &&
      (!ps.q || [p.title, p.breed, p.district, p.address, seller(p)?.name].join(' ').includes(ps.q)));
    const sel = T.posts.sel; for (const id of [...sel]) if (!posts().some(p => p.id === id)) sel.delete(id);
    $('bulk').innerHTML = sel.size ? `<div class="bulk"><b>${bn(sel.size)}টি নির্বাচিত</b>
      <button class="btn btn-amber btn-sm" data-bulk="ok">${ic('lucide:check')} অনুমোদন</button>
      <button class="btn btn-line btn-sm" data-bulk="no">${ic('lucide:x')} বাতিল</button>
      <button class="btn btn-line btn-sm" data-bulk="del">${ic('lucide:trash')} মুছুন</button>
      <button class="bulk-x" data-bulk="clear">নির্বাচন সরান</button></div>` : '';
    $('plist').innerHTML = table('posts', [
      { key: 'title', label: 'পোস্ট', val: p => p.title, html: p => `<div class="dt-cell">${thumb(p.images[0] || ph(catOf(p.cat).icon))}<div><b class="dt-t">${esc(p.title)}</b><small>${esc(p.breed)}${p.reason ? ` <span class="why">· কারণ: ${esc(p.reason)}</span>` : ''}</small></div></div>` },
      { key: 'cat', label: 'ক্যাটাগরি', val: p => catOf(p.cat).name, html: p => `<span class="dt-cat">${catPic(catOf(p.cat))}${esc(catOf(p.cat).name)}</span>` },
      { key: 'seller', label: 'বিক্রেতা', val: p => seller(p)?.name || '', html: p => { const s = seller(p); return `<div class="dt-cell">${avatar(s, 'sm')}<div><b class="dt-t">${esc(s?.name || '-')}</b><small>${bn(esc(p.phone))}</small></div></div>`; } },
      { key: 'district', label: 'এলাকা', val: p => p.district, html: p => esc(p.district) },
      { key: 'price', label: 'দাম', val: p => p.price, cls: 'c-num', html: p => `<b>${money(p.price)}</b>` },
      { key: 'qty', label: 'পরিমাণ', val: p => p.count, cls: 'c-num', html: p => `${bn(p.count)}টি` },
      { key: 'status', label: 'অবস্থা', val: p => p.status, html: p => stBadge(p.status) },
      { key: 'date', label: 'সময়', val: p => p.createdAt, html: p => `<span class="dt-time">${ago(p.createdAt)}</span>` },
      { key: 'act', label: 'অ্যাকশন', cls: 'c-act', html: p => `<div class="acts-row">
          <a class="ib" href="/post?id=${p.id}" target="_blank" rel="noopener" aria-label="দেখুন" title="দেখুন">${ic('lucide:eye')}</a>
          ${p.status !== 'approved' ? `<button class="ib ok" data-a="ok" data-id="${p.id}" aria-label="অনুমোদন" title="অনুমোদন">${ic('lucide:check')}</button>` : ''}
          ${p.status !== 'rejected' ? `<button class="ib" data-a="no" data-id="${p.id}" aria-label="বাতিল" title="বাতিল">${ic('lucide:x')}</button>` : ''}
          <button class="ib" data-a="del" data-id="${p.id}" aria-label="মুছুন" title="মুছুন">${ic('lucide:trash')}</button></div>` },
    ], list, { selectable: true, id: p => p.id, minw: 1180, empty: 'কোনো পোস্ট পাওয়া যায়নি' });
  }
  document.addEventListener('click', e => {
    const b = e.target.closest('[data-bulk]'); if (!b) return;
    const sel = T.posts.sel, ids = [...sel], act = b.dataset.bulk;
    if (act === 'clear') { sel.clear(); return drawPosts(); }
    if (act === 'ok') { savePosts(posts().map(p => sel.has(p.id) ? { ...p, status: 'approved', reason: '' } : p)); sel.clear(); toast(`${bn(ids.length)}টি পোস্ট অনুমোদিত হয়েছে`); render(); }
    else if (act === 'del') { if (confirm(`${bn(ids.length)}টি পোস্ট স্থায়ীভাবে মুছবেন?`)) { savePosts(posts().filter(p => !sel.has(p.id))); sel.clear(); toast('পোস্টগুলো মুছে ফেলা হয়েছে'); render(); } }
    else if (act === 'no') {
      openModal(`<h3>${bn(ids.length)}টি পোস্ট বাতিলের কারণ</h3><div class="field"><textarea id="rs" style="min-height:96px" placeholder="যেমন: ছবি অস্পষ্ট, তথ্য অসম্পূর্ণ"></textarea></div>
        <div class="mact"><button class="btn btn-line" data-close>ফিরে যান</button><button class="btn btn-green" id="rok">বাতিল করুন</button></div>`);

      <div class="field"><label>ভূমিকা</label><select id="ur" aria-label="ভূমিকা"><option value="user">ইউজার</option><option value="admin">অ্যাডমিন</option></select></div>

      else if (users().some(x => x.phone === phone)) { $('ufp').classList.add('bad'); $('ufp').querySelector('.err').textContent = 'এই নম্বরে আগেই একাউন্ট আছে'; ok = false; }

  function catModal(idx) {
    const c = idx == null ? { name: '', desc: '', icon: 'lucide:paw-print', breeds: [] } : CATS[idx];
    let img = c.img || '', tags = [...(c.breeds || [])];
    const tagHtml = () => tags.map((t, i) => `<span class="tg">${esc(t)}<button type="button" data-rm="${i}" aria-label="সরান">${ic('lucide:x')}</button></span>`).join('');
    openModal(`<h3>${idx == null ? 'নতুন ক্যাটাগরি' : 'ক্যাটাগরি এডিট'}</h3>
      <div class="field" id="cfi"><label>ছবি</label>
        <div class="cimg"><span class="cic" id="cimgp">${img ? `<img class="cpic" src="${esc(img)}" alt="">` : ic('lucide:images')}</span>
          <label class="btn btn-line btn-sm" for="cimg">${ic('lucide:images')} ছবি বাছাই করুন</label><input type="file" id="cimg" accept="image/*" class="hide"></div>
        <span class="err">ক্যাটাগরির ছবি দিন</span></div>
      <div class="field" id="cfn"><label>নাম</label><input id="cn" placeholder="ক্যাটাগরির নাম লিখুন" value="${esc(c.name)}" maxlength="40"><span class="err">নাম লিখুন</span></div>
      <div class="field"><label>বিবরণ</label><textarea id="cd" style="min-height:84px" maxlength="200" placeholder="ক্যাটাগরির সংক্ষিপ্ত বিবরণ লিখুন">${esc(c.desc || '')}</textarea></div>
      <div class="field"><label>জাত / প্রকার</label>
        <div class="tagbox" id="tgb"><span id="tgs">${tagHtml()}</span><input id="tgi" placeholder="জাতের নাম লিখে Enter চাপুন"></div>
        <span class="hint">প্রতিটি জাত লিখে Enter বা কমা দিন। ✕ চাপলে সরে যাবে।</span></div>
      <div class="mact"><button class="btn btn-line" data-close>বাতিল</button><button class="btn btn-green" id="csave">সেভ করুন</button></div>`);
    const addTag = v => { v = v.trim().replace(/,$/, '').trim(); if (v && !tags.includes(v)) { tags.push(v); $('tgs').innerHTML = tagHtml(); } $('tgi').value = ''; };
    $('tgi').onkeydown = e => {
      if (e.key === 'Enter' || e.key === ',') { e.preventDefault(); addTag($('tgi').value); }
      else if (e.key === 'Backspace' && !$('tgi').value && tags.length) { tags.pop(); $('tgs').innerHTML = tagHtml(); }
    };
    $('tgi').onblur = () => addTag($('tgi').value);
    $('tgb').onclick = e => { const b = e.target.closest('[data-rm]'); if (b) { tags.splice(+b.dataset.rm, 1); $('tgs').innerHTML = tagHtml(); } else $('tgi').focus(); };
    $('cimg').onchange = async e => { const f = e.target.files[0]; if (!f) return; img = await KB.shrink(f); $('cimgp').innerHTML = `<img class="cpic" src="${img}" alt="">`; };
    $('csave').onclick = () => {
      addTag($('tgi').value);
      const name = $('cn').value.trim(), desc = $('cd').value.trim();
      ['cfi', 'cfn'].forEach(i => $(i).classList.remove('bad'));
      let ok = true; if (!name) { $('cfn').classList.add('bad'); ok = false; } if (!img) { $('cfi').classList.add('bad'); ok = false; } if (!ok) return;
      const list = CATS.map(x => ({ ...x }));
      if (idx == null) list.push({ id: 'c' + Date.now().toString(36), name, desc, icon: 'lucide:paw-print', breeds: tags, img });
      else {
        const old = list[idx], same = JSON.stringify(old.breeds) === JSON.stringify(tags);
        list[idx] = { ...old, name, desc, breeds: tags, img };
        if (!same) delete list[idx].groups;
      }
      KB.saveCats(list); closeModal(); toast('ক্যাটাগরি সেভ হয়েছে'); render();
    };
  }

    ], list, { minw: 980, empty: 'কোনো ব্লগ পাওয়া যায়নি', emptyIcon: 'lucide:book-open' });
  }
  function blogModal(id) {

      <div class="field" id="bfb"><label>ব্লগের লেখা</label><textarea id="bb" style="min-height:220px" placeholder="প্রতিটি অনুচ্ছেদের মাঝে একটি ফাঁকা লাইন দিন">${esc(b.body)}</textarea>
        <span class="hint">সাজানোর নিয়ম: <b>## শিরোনাম</b> লিখলে উপশিরোনাম হবে, <b>- লেখা</b> লিখলে তালিকা হবে।</span><span class="err">ব্লগের লেখা লিখুন</span></div>
      <label class="bpub"><input type="checkbox" id="bp" ${b.published === false ? '' : 'checked'}><span>সঙ্গে সঙ্গে প্রকাশ করুন</span></label>
      <div class="mact"><button class="btn btn-line" data-close>বাতিল</button><button class="btn btn-green" id="bsave">${old ? 'আপডেট করুন' : 'সেভ করুন'}</button></div>`);
    $('bc').value = b.cat; $('bc').dispatchEvent(new Event('change'));
    $('bci').onchange = async e => { const f = e.target.files[0]; if (!f) return; cover = await KB.shrink(f, 1280); $('bcp').innerHTML = `<img src="${cover}" alt="">`; };
    $('bsave').onclick = () => {
      const v = { title: $('bt').value.trim(), cat: $('bc').value, excerpt: $('be').value.trim(), body: $('bb').value.trim() };
      ['bft', 'bfc', 'bfe', 'bfb'].forEach(i => $(i).classList.remove('bad'));
      let ok = true;
      if (v.title.length < 5) { $('bft').classList.add('bad'); ok = false; }
      if (!cover) { $('bfc').classList.add('bad'); ok = false; }
      if (!v.excerpt) { $('bfe').classList.add('bad'); ok = false; }

      const list = KB.blogsRaw(), published = $('bp').checked;
      if (old) { const i = list.findIndex(x => x.id === old.id); list[i] = { ...old, ...v, cover, published }; }

      KB.saveBlogs(list); closeModal(); toast(old ? 'ব্লগ আপডেট হয়েছে' : 'ব্লগ যোগ হয়েছে'); render();

    else if (a === 'del' && confirm('ব্লগটি স্থায়ীভাবে মুছবেন?')) { KB.saveBlogs(list.filter(x => x.id !== id)); toast('ব্লগ মুছে ফেলা হয়েছে'); render(); }

  // ---------- actions (event delegation) ----------
  document.addEventListener('click', e => {
    const v = e.target.closest('[data-v]'); if (v && !v.closest('#anav')) { go(v.dataset.v); return; }
    const a = e.target.closest('[data-a]');
    if (a) {
      const id = +a.dataset.id, act = a.dataset.a;
      if (act === 'ok') { setStatus(id, 'approved'); toast('পোস্ট অনুমোদিত হয়েছে'); render(); }
      else if (act === 'del') { if (confirm('পোস্টটি স্থায়ীভাবে মুছবেন?')) { savePosts(posts().filter(p => p.id !== id)); toast('পোস্ট মুছে ফেলা হয়েছে'); render(); } }
      else if (act === 'no') {
        openModal(`<h3>বাতিলের কারণ</h3><div class="field"><textarea id="rs" style="min-height:96px" placeholder="যেমন: ছবি অস্পষ্ট, তথ্য অসম্পূর্ণ"></textarea></div>
          <div class="mact"><button class="btn btn-line" data-close>ফিরে যান</button><button class="btn btn-green" id="rok">বাতিল করুন</button></div>`);
        $('rok').onclick = () => { setStatus(id, 'rejected', $('rs').value.trim()); closeModal(); toast('পোস্ট বাতিল করা হয়েছে'); render(); };
      }
      return;
    }
    const x = e.target.closest('[data-u]');
    if (x) {
      const id = +x.dataset.id, t = x.dataset.u, list = users();
      if (t === 'role') { saveUsers(list.map(y => y.id === id ? { ...y, role: y.role === 'admin' ? 'user' : 'admin' } : y)); toast('ভূমিকা বদলানো হয়েছে'); }
      else if (t === 'block') { saveUsers(list.map(y => y.id === id ? { ...y, blocked: !y.blocked } : y)); toast('ইউজারের অবস্থা বদলানো হয়েছে'); }
      else if (t === 'del') {
        if (!confirm('ইউজার ও তার সব পোস্ট স্থায়ীভাবে মুছে যাবে। চালিয়ে যাবেন?')) return;
        saveUsers(list.filter(y => y.id !== id)); savePosts(posts().filter(p => p.sellerId !== id)); toast('ইউজার মুছে ফেলা হয়েছে');
      }
      render(); return;
    }
    const c = e.target.closest('[data-c]');
    if (c) {
      const t = c.dataset.c, i = +c.dataset.i;
      if (t === 'add') return catModal();
      if (t === 'edit') return catModal(i);
      const list = CATS.map(y => ({ ...y }));
      if (t === 'up' || t === 'down') { const j = t === 'up' ? i - 1 : i + 1; [list[i], list[j]] = [list[j], list[i]]; KB.saveCats(list); render(); }
      else if (t === 'del') {
        const used = posts().filter(p => p.cat === list[i].id).length;
        if (used) return toast(`এই ক্যাটাগরিতে ${bn(used)}টি পোস্ট আছে, আগে সেগুলো সরান`);
        if (list.length <= 1) return toast('অন্তত একটি ক্যাটাগরি থাকতে হবে');
        if (confirm(`"${list[i].name}" ক্যাটাগরি মুছবেন?`)) { list.splice(i, 1); KB.saveCats(list); toast('ক্যাটাগরি মুছে ফেলা হয়েছে'); render(); }
      }
    }
  });

  KB.hydrate();
  render();
})();
</script>
</body>
</html>
