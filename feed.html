<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>সব পোস্ট | খামারি বাজার</title>
<meta name="description" content="সারা বাংলাদেশের গরু, ছাগল, ভেড়া, মুরগি, হাঁস, কবুতর ও মাছের সব পোস্ট এক জায়গায়। ফিল্টার করে নিজের পছন্দের পশু খুঁজে নিন।">
<meta name="theme-color" content="#12291e">
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&text=0123456789.,%25%2B:&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css">
<link rel="stylesheet" href="css/style.css?v=202610040451">
<link rel="stylesheet" href="css/feed.css?v=202610040451">
</head>
<body data-page="feed" data-noblog>
<div id="nav"></div>
<script src="js/icons.js?v=202610040451"></script>
<script src="js/app.js?v=202610040451"></script>
<script>KB.mountNav('browse')</script>

<div class="wrap">
  <header class="fh">
    <div class="fh-t">
      <h1 class="fh-title"><img src="img/feed-title.webp" width="800" height="283" alt="সব পোস্ট" fetchpriority="high" decoding="async"></h1>
      <p><b id="topCount">0</b>টি পশু পাওয়া গেছে</p>
    </div>
    <form class="fh-search" id="heroSearch" role="search">
      <span class="fh-si" id="fsi"></span>
      <input id="hq" type="search" placeholder="পশু, জাত বা এলাকা খুঁজুন" aria-label="খুঁজুন" autocomplete="off">
      <button class="btn btn-amber" type="submit">খুঁজুন</button>
    </form>
  </header>

  <div class="cats-sw"><button class="cat-nav cat-prev" aria-label="আগের"><i data-ic="lucide:chevron-left"></i></button><button class="cat-nav cat-next" aria-label="পরের"><i data-ic="lucide:chevron-right"></i></button>
    <div class="swiper" id="cats"><div class="swiper-wrapper" id="catsWrap"></div></div></div>

  <div class="layout two" id="feed">
    <aside class="side left" id="fPanel">
      <div class="card fp">
        <div class="fp-head">
          <h3><span class="fp-ic"><i data-ic="lucide:sliders-horizontal"></i></span>ফিল্টার <em id="fCount" class="hide">0</em></h3>
          <button class="fp-clear hide" id="reset">সব মুছুন</button>
          <button class="fp-x" id="fClose" aria-label="বন্ধ করুন"><i data-ic="lucide:x"></i></button>
        </div>
        <div class="fp-res"><b id="rCount">0</b><span>টি পশু পাওয়া গেছে</span></div>
        <div class="fp-active" id="fActive"></div>

        <div class="fp-sec"><h4>সাজান</h4>
          <div class="segw" id="sortSeg"><button data-s="new" class="on">নতুন</button><button data-s="low">কম দাম</button><button data-s="high">বেশি দাম</button></div></div>

        <div class="fp-sec"><h4>ক্যাটাগরি</h4><select id="fc" aria-label="ক্যাটাগরি"><option value="">সব ক্যাটাগরি</option></select></div>
        <div class="fp-sec hide" id="fbw"><h4>জাত / প্রকার</h4><select id="fb" aria-label="জাত"><option value="">সব জাত</option></select></div>
        <div class="fp-sec"><h4>জেলা</h4><select id="fd" aria-label="জেলা"><option value="">সব জেলা</option></select></div>

        <div class="fp-sec"><h4>দামের সীমা</h4>
          <div class="fp-price"><label><i>৳</i><input id="pmin" type="number" inputmode="numeric" min="0" placeholder="সর্বনিম্ন"></label><span>-</span><label><i>৳</i><input id="pmax" type="number" inputmode="numeric" min="0" placeholder="সর্বোচ্চ"></label></div>
          <div class="qchips" id="qp"><button data-max="20000">20 হাজার</button><button data-max="50000">50 হাজার</button><button data-max="100000">1 লাখ</button><button data-max="200000">2 লাখ</button></div></div>

        <div class="fp-foot"><button class="btn btn-amber btn-block fp-apply" id="fApply">ফলাফল দেখুন</button></div>
      </div>
    </aside>
    <div class="fbg" id="fBg"></div>

    <main>
      <div class="ftool">
        <button class="mf-btn" id="fOpen"><span><i data-ic="lucide:sliders-horizontal" class="h-ic"></i> ফিল্টার <em id="fCount2" class="hide">0</em></span><b><i id="rCount2">0</i> টি পশু</b></button>
        <div class="ftool-r">
          <select id="sortSel" aria-label="সাজান"><option value="new">নতুন আগে</option><option value="low">দাম: কম থেকে বেশি</option><option value="high">দাম: বেশি থেকে কম</option></select>
          <div class="vt" role="group" aria-label="দেখার ধরন"><button id="vl" class="on" aria-label="লিস্ট ভিউ"><i data-ic="lucide:list-checks"></i></button><button id="vg" aria-label="গ্রিড ভিউ"><i data-ic="lucide:layout-grid"></i></button></div>
        </div>
      </div>
      <div id="list"></div>
      <div class="sentinel hide" id="more"><div class="spin" aria-hidden="true"></div><span>আরও পোস্ট লোড হচ্ছে...</span></div>
      <div class="feed-end hide" id="feedEnd">সব পোস্ট দেখা হয়েছে</div>
      <div class="back-top"><button class="ft-up" id="toTop"><i data-ic="lucide:arrow-up"></i> <span>উপরে যান</span></button></div>
    </main>
  </div>
  <div class="feed-pad"></div>
</div>

<div class="modal sheet" id="allSheet"><div class="box">
  <div class="sheet-h"><h3>সব ক্যাটাগরি</h3><button id="allX" aria-label="বন্ধ করুন"><i data-ic="lucide:x"></i></button></div>
  <div class="all-grid" id="allGrid"></div></div></div>

<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
<script src="js/social.js?v=202610040451"></script>
<script src="js/home.js?v=202610040451"></script>
</body>
</html>
